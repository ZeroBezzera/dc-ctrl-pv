name: Discord Bot

on:
  push:
    branches:
      - main  # Możesz zmienić na swoją gałąź
  schedule:
    - cron: '0 * * * *'  # Uruchomienie co godzinę (możesz zmienić)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'  # Możesz zmienić wersję Pythona

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run bot
      env:
        TOKEN: ${{ secrets.BOT_TOKEN }}  # Token bota w secrets
      run: |
        python Control.py
